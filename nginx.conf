server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entry point or bootstrap — forces browser to fetch fresh on every visit.
    # Safari iOS aggressively disk-caches; no-store + Expires in the past defeats bfcache.
    location ~ ^/(index\.html|flutter_bootstrap\.js|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "Sat, 01 Jan 2000 00:00:00 GMT" always;
        add_header Vary "Accept-Encoding" always;
    }

    # Flutter hashed assets (fonts, canvaskit, images) — immutable, cache forever.
    # ^~ ensures this wins over the regex .js/.css rule below.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    # Top-level JS/CSS (main.dart.js, etc.) — always revalidate
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
    }

    # SPA fallback — internal redirect to /index.html inherits its no-cache headers
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}