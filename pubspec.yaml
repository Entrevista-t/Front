name: app
description: "Entrevista't - Plataforma de preparació d'entrevistes amb IA"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  permission_handler: ^11.3.0
  http: ^1.2.2
  http_parser: ^4.1.0
  go_router: ^14.6.2
  fl_chart: ^0.69.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/avatar_1.png
    - assets/images/avatar_2.png
    - assets/images/avatar_3.png
    - assets/images/avatar_4.png
    - assets/images/avatar_5.png
    - assets/images/avatar_6.png
    - assets/images/avatar_7.png
    - assets/images/avatar_8.png
    - assets/images/avatar_9.png
  fonts:
    - family: Gambetta
      fonts:
        - asset: assets/fonts/Gambetta/Gambetta-Variable.ttf
        - asset: assets/fonts/Gambetta/Gambetta-VariableItalic.ttf
          style: italic
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Satoshi-Variable.ttf
        - asset: assets/fonts/Satoshi/Satoshi-VariableItalic.ttf
          style: italic
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/Noto/NotoSans-Regular.ttf
        - asset: assets/fonts/Noto/NotoSans-Italic.ttf
          style: italic
        - asset: assets/fonts/Noto/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Noto/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic
