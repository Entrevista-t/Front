<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Entrevista't — Preparació d'entrevistes amb IA">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Entrevista't">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Preload Material Icons font to avoid flash of missing icons -->
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/otf" crossorigin>

  <title>Entrevista't</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0A0F1A;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #0A0F1A;
      gap: 20px;
    }

    #loading-wordmark {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #F1F5F9;
      letter-spacing: -0.3px;
    }

    #loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Shown while Flutter initializes -->
  <div id="loading">
    <div id="loading-wordmark">Entrevista't</div>
    <div id="loading-spinner"></div>
  </div>

  <script>
    // Hide the loading screen once Flutter signals it's ready
    window.addEventListener('flutter-first-frame', function() {
      const loader = document.getElementById('loading');
      if (loader) {
        loader.style.transition = 'opacity 0.3s ease';
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
    });

    // Handle tabs extension messages to prevent console errors
    if (window.chrome && window.chrome.runtime) {
      window.chrome.runtime.onMessage.addListener(function(request, sender, sendResponse) {
        if (request.message === 'ready' || request.type === 'tabs:outgoing.message.ready') {
          sendResponse({status: 'acknowledged'});
        }
      });
    }

    // Fallback listener for unhandled runtime messages
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'tabs:outgoing.message.ready') {
        event.preventDefault && event.preventDefault();
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
